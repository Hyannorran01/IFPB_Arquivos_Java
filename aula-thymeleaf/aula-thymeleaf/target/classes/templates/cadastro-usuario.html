<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Usuário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Novo Usuário</h2>

    <form th:action="@{/salvar}" th:object="${user}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Digite o nome" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="Digite o email">
        </div>

        <div class="d-flex justify-content-between">
            <a href="/aula" class="btn btn-secondary">Cancelar</a>
            <button type="submit"  class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
</body>

</html>

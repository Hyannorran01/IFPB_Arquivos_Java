<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aula Thymeleaf</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Lista de Usuários</h1>

    <a href="/cadastro-usuario" class="btn btn-primary mb-3">Novo Usuário</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.name}">Fulano</td>
            <td th:text="${user.email}">fulano@email.com</td>
            <td>
                <a th:href="@{/detalhes/{id}(id=${user.id})}" class="btn btn-info">
                    Detalhes
                </a>
                <a th:href="@{/editar/{id}(id=${user.id})}" class="btn btn-warning">
                    Editar
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .detail-item { margin-bottom: 1em; }
        .detail-item strong { display: block; color: #555; }
        .btn { display: inline-block; padding: 10px 15px; margin-top: 20px; text-decoration: none; background-color: #007bff; color: white; border-radius: 5px; }
        .btn:hover { background-color: #0056b3; }
        .error { color: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <div th:if="${usuario}">
        <hr>
        <div class="detail-item">
            <strong>Nome:</strong>
            <span th:text="${usuario.name}">123</span>
        </div>

        <div class="detail-item">
            <strong>E-mail:</strong>
            <span th:text="${usuario.email}">Exemplo</span>
        </div>
    </div>

    <div th:if="${usuario == null}">
        <h1 class="error">Usuário não encontrado!</h1>
        <p>O Usuário que você está tentando visualizar não existe ou foi removido.</p>
    </div>

    <a th:href="@{/}" class="btn">Voltar</a>
</div>

</body>
</html>

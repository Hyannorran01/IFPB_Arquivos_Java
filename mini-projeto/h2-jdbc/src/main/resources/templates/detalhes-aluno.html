<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Aluno</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Detalhes do Aluno</h1>

    <a href="/" class="btn btn-info mb-3">Voltar para Lista</a>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <td th:text="${aluno.id}"></td>
        </tr>
        <tr>
            <th>Nome</th>
            <td th:text="${aluno.nome}"></td>
        </tr>
        <tr>
            <th>Matrícula</th>
            <td th:text="${aluno.matricula}"></td>
        </tr>
        <tr>
            <th>Turma</th>
            <td th:text="${aluno.turma != null ? aluno.turma.nome : 'Sem turma'}"></td>
        </tr>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Turmas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Lista de Turmas</h1>

    <a href="/cadastro-turma" class="btn btn-primary mb-3">Nova Turma</a>
    <a href="/detalhes" class="btn btn-info mb-3" style="margin-left:5px;">Detalhes de Alunos</a>
    <a href="/" class="btn btn-secondary mb-3">Voltar</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Código</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="turma : ${turmas}">
            <td th:text="${turma.id}">1</td>
            <td th:text="${turma.nome}">Turma A</td>
            <td th:text="${turma.codigo}">TURMA01</td>
            <td>
                <a th:href="@{'/editar-turma/' + ${turma.id}}" class="btn btn-warning">Editar</a>
                <form th:action="@{'/deletar-turma/' + ${turma.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Deseja realmente deletar?');">Deletar</button>
                </form>
                <a th:href="@{'/vincular-aluno/' + ${turma.id}}" class="btn btn-success" style="margin-left:5px;">Vincular Aluno</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

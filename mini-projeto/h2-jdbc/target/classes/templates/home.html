<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aula Thymeleaf</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Lista de Alunos</h1>

    <a href="/cadastro-aluno" class="btn btn-primary mb-3">Novo Aluno</a>
    <a href="/turmas" class="btn btn-secondary mb-3">Ver Turmas</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Matricula</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="aluno : ${alunos}">
            <td th:text="${aluno.id}">1</td>
            <td th:text="${aluno.nome}">Fulano</td>
            <td th:text="${aluno.matricula}">fulano@email.com</td>
            <td>
                <a th:href="@{'/detalhes-aluno/' + ${aluno.id}}" class="btn btn-info">
                    Detalhes
                </a>
                <a th:href="@{'/editar-aluno/' + ${aluno.id}}" class="btn btn-warning">
                    Editar
                </a>
                <form th:action="@{'/deletar-aluno/' + ${aluno.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Deseja realmente deletar?');">Deletar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1 class="mb-4">Editar Turma</h1>

    <form th:action="@{/editar-turma/{id}(id=${turma.id})}" method="post" class="mb-4">
        <input type="hidden" name="id" th:value="${turma.id}" />
        <div class="mb-3">
            <label for="nome" class="form-label">Nome da Turma</label>
            <input type="text" class="form-control" id="nome" name="nome" th:value="${turma.nome}" required>
        </div>
        <div class="mb-3">
            <label for="codigo" class="form-label">Código</label>
            <input type="text" class="form-control" id="codigo" name="codigo" th:value="${turma.codigo}" required>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/turmas" class="btn btn-secondary">Voltar</a>
    </form>
</div>

</body>
</html>

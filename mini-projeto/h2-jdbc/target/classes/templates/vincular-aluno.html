<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vincular Aluno à Turma</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Vincular Aluno à Turma</h1>

    <div class="mb-3">
        <strong>Turma:</strong>
        <span th:text="${turma.nome}">Nome da Turma</span> |
        <strong>Código:</strong>
        <span th:text="${turma.codigo}">Código</span>
    </div>

    <form th:action="@{/vincular-aluno/{id}(id=${turma.id})}" method="post" class="mb-4">
        <div class="mb-3">
            <label for="alunoId" class="form-label">Selecione o Aluno</label>
            <select class="form-control" id="alunoId" name="alunoId" required>
                <option th:each="aluno : ${alunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Vincular</button>
        <a th:href="@{/turmas}" class="btn btn-secondary">Voltar</a>
    </form>
</div>
</body>
</html>

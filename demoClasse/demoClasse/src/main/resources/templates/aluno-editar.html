<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <html xmlns:th="http://www.thymeleaf.org">
    <style>
        body { font-family: sans-serif; margin: 2em; }
        .container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 1em; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { display: inline-block; padding: 10px 15px; text-decoration: none; color: white; border-radius: 5px; border: none; cursor: pointer; }
        .btn-primary { background-color: #28a745; }
        .btn-primary:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
        .error { color: #d9534f; }
    </style>
</head>
<body>

<div class="container">
    <div th:if="${aluno}">
        <h1>Editação de Aluno</h1>
        <hr>

        <form th:action="@{/salvar-editar}" th:object="${aluno}" method="post">

            <input  th:field="*{matricula}" />

            <div class="form-group">
                <label for="nome">Nome do Aluno:</label>
                <input type="text" id="nome" th:field="*{nome}" />
            </div>

            <div class="form-group">
                <label for="idade">Idade do aluno:</label>
                <input type="text" id="idade" th:field="*{idade}" />
            </div>

            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <div th:if="${aluno == null}">
        <h1 class="error">Aluno não encontrado!</h1>
        <p>Você não pode editar um aluno que não existe.</p>
        <a th:href="@{/}" class="btn">Voltar</a>
    </div>
</div>

</body>
</html>

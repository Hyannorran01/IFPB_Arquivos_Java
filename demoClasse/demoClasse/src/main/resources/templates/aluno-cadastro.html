<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <html xmlns:th="http://www.thymeleaf.org">
    <title>Title</title>
</head>
<body>
<div class="container mt-5">
    <h2>Cadastro de Novo Aluno</h2>

    <form th:action="@{/salvar}" th:object="${aluno}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Digite o Nome" required>
        </div>

        <div class="mb-3">
            <label for="idade" class="form-label">Idade</label>
            <input type="text" th:field="*{idade}" class="form-control" id="idade" placeholder="Digite a Idade">
        </div>
        <div class="mb-3">
            <label for="matricula" class="form-label">Matricula</label>
            <input type="text" th:field="*{matricula}" class="form-control" id="matricula" placeholder="Digite a Matricula">
        </div>

        <div class="d-flex justify-content-between">
            <a href="/aula" class="btn btn-secondary">Cancelar</a>
            <button type="submit"  class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

</body>
</html>

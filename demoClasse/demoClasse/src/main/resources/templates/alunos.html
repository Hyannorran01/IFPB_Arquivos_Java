<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        th{ background-color: silver;
            padding-left: 20px;
            padding-right: 20px;}

            td {border-style: solid; border-color: #8b8bf7;}

            h1 {color: #0000ff;}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>

<h1 class="mb-4">Lista de Alunos</h1>

<a href="/aluno-cadastro.html" class="btn btn-primary mb-3">Novo Aluno</a>

<table>
    <thead>
    <tr>
        <th>Matricula</th>
        <th>Nome</th>
        <th>Idade</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="aluno : ${alunosList}">
        <td th:text="${aluno.matricula}">9345</td>
        <td th:text="${aluno.nome}">NomeTestador</td>
        <td th:text="${aluno.idade}">18</td>
        <td>
            <a th:href="@{/detalhes/{matricula}(id=${aluno.matricula})}" class="btn btn-info">
                Detalhes
            </a>
            <a th:href="@{/editar/{matricula}(id=${aluno.matricula})}" class="btn btn-warning">
                Editar
            </a>

            <a th:href="@{/Apagar/{matricula}(id=${aluno.matricula})}" class="btn btn-danger"> Apagar</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <html xmlns:th="http://www.thymeleaf.org">
    <title>Document-Cadastro</title>
</head>
<body>
<div class="container mt-6">
    <h2>Cadastro de Nova Turma</h2>
    <form th:action="@{/salvarTurma}" th:object="${turma}" method="post" class="mt-6">
        <div class="mb-6">
            <label for="nome" class="form-label">Nome da Turma</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" placeholder="Digite o Nome da turma" required>
        </div>
        <div class="mb-6">
            <label for="id" class="form-label">Identificador</label>
            <input type="text" th:field="*{id}" class="form-control" id="id" placeholder="Digite o id">
        </div>
        <div class="d-flex justify-content-between">
            <a href="/turma" class="btn btn-secondary">Cancelar</a>
            <button type="submit"  class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>
</body>
</html>

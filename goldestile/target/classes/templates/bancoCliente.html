<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type= "text/css" href="/style/style.css">
    <title>Clientes Cadastados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <header>
        <h2 class="mb-4">Lista de Clientes</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Senha</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.CPF}"></td>
            <td th:text="${cliente.nome}"></td>
            <td th:text="${cliente.email}"></td>
            <td th:text="${cliente.senha}"></td>
            <td><form th:action="@{'/deletar-cadastro/' + ${cliente.CPF}}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Deseja realmente deletar?');">Deletar</button>
            </form></td>
        </tr>
        </tbody>
    </table>
        <a href="/admin"><button>Retornar a Tela do Administrador</button></a>
</header>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type= "text/css" href="/style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-OevHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <title>Nova Camisa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <header>
    <h2>Nova Camisa</h2>
    <form th:action="@{/salvar}" th:object="${camisa}" method="post" class="mt-4">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" th:field="*{nome}" class="form-control" id="nome" name="nome" placeholder="Digite o nome do time" required>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" th:field="*{descricao}" class="form-control" id="descricao" name="descricao" placeholder="detalhes" required>
        </div>

        <div class="mb-3">
            <label for= "quantidade" class="form-label">Quantidade</label>
            <input type="number" th:field="*{quantidade}" class="form-control" id="quantidade" name="quantidade" placeholder="Digite a quantidade" required>
        </div>

        <div class="mb-3">
            <label for="valor" class="form-label">Valor</label>
            <input type="number" th:field="*{valor}" class="form-control" id="valor" name="valor" placeholder="Digite o valor da camisa" required>
        </div>
        <button type="submit"  class="btn btn-primary">Salvar</button>
    </form>
        <a href="/admin"><button class="btn btn-secondary">Retornar</button></a>
    </header>
</div>
<footer>
    <p>&copy; 2025 Golde Stile - Todos os direitos reservados.</p>
</footer>
</body>
</html>

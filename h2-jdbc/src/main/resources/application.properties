spring.application.name=h2-jdbc

# Habilita o console web do H2
spring.h2.console.enabled=true

# Define o caminho para acessar o console (ex: http://localhost:8080/h2-console)
spring.h2.console.path=/h2

# URL de conexão para um banco em memória chamado 'testdb'
spring.datasource.url=jdbc:h2:mem:aula-h2db

# Driver JDBC do H2
spring.datasource.driverClassName=org.h2.Driver

# Usuário padrão do H2 (sem senha)
spring.datasource.username=sa
spring.datasource.password=

log4j.logger.org.springframework.jdbc.core = TRACE